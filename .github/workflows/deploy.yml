name: Deploy Infrastructure

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      # Commit SHA to check out. Empty leaves checkout on the triggering ref, which is
      # correct for every same-repo event; the fork path sets it because
      # pull_request_target otherwise resolves to the base branch.
      pr_ref:
        required: false
        type: string
        default: ''
    secrets:
      AUTH_SERVER_ACCOUNT_ID:
        required: true
      DOMAIN_HOSTED_ZONE_ID:
        required: true
      DOMAIN_HOSTED_ZONE_NAME:
        required: true

env:
  AWS_REGION: ${{ inputs.aws_region }}
  AWS_PAGER: ""
  NODE_VERSION: '24'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # A SHA, never a branch name, which would re-resolve and could pick up a
          # commit pushed after approval.
          ref: ${{ inputs.pr_ref }}
          # checkout >= v6.1.0 refuses fork-PR checkouts under pull_request_target
          # without this. Ours is the gated case: the caller only supplies pr_ref after
          # the safe-to-deploy label and fork-review approval. Stays false for
          # same-repo events, where an empty ref skips the guard entirely.
          allow-unsafe-pr-checkout: ${{ inputs.pr_ref != '' }}
      - name: Setup AWS OIDC
        uses: ./.github/actions/setup-aws-oidc
        with:
          aws_region: ${{ inputs.aws_region }}
          account_id: ${{ secrets.AUTH_SERVER_ACCOUNT_ID }}
          role_duration_seconds: '7200'
      - name: Setup CDK
        uses: ./.github/actions/setup-cdk
        with:
          node_version: ${{ env.NODE_VERSION }}
      - name: Generate deployment.json
        uses: ./.github/actions/generate-deployment-json
        with:
          account_id: ${{ secrets.AUTH_SERVER_ACCOUNT_ID }}
          region: ${{ inputs.aws_region }}
          hosted_zone_id: ${{ secrets.DOMAIN_HOSTED_ZONE_ID }}
          hosted_zone_name: ${{ secrets.DOMAIN_HOSTED_ZONE_NAME }}
      - name: Build and synthesize CDK
        working-directory: cdk
        run: |
          npm run build
          cdk synth
      - name: Bootstrap CDK
        working-directory: cdk
        run: cdk bootstrap --force
      - name: Deploy CDK infrastructure
        working-directory: cdk
        run: |
          set +e
          cdk deploy --all --require-approval never --concurrency 3
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::CDK deploy failed with exit code $EXIT_CODE"
            exit 1
          fi
