name: Notify Slack (Nightly Failure)

on:
  workflow_call:
    inputs:
      run_url:
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK:
        required: true

permissions:
  contents: read

jobs:
  notify-nightly-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send nightly failure notification
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: '${{ github.event.repository.name }} nightly build failed'
          SLACK_FOOTER: ''
          MSG_MINIMAL: true
          SLACK_MESSAGE: 'Nightly build failed: ${{ inputs.run_url }}'
